<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C35" />
      <stop offset="50%" stop-color="#0B1B32" />
      <stop offset="100%" stop-color="#020B18" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0062FE" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="sphereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0062FE" />
      <stop offset="100%" stop-color="#071C35" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="rgba(0, 98, 254, 0.15)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
  </g>

  <!-- Central AI Glowing Hologram / Network Sphere -->
  <circle cx="400" cy="380" r="160" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="400" cy="380" r="120" fill="url(#blueGlow)" filter="url(#glow)" />
  <circle cx="400" cy="380" r="80" fill="url(#sphereGrad)" />

  <!-- Network nodes & data links -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.75">
    <line x1="400" y1="380" x2="280" y2="260" />
    <line x1="400" y1="380" x2="520" y2="260" />
    <line x1="400" y1="380" x2="260" y2="480" />
    <line x1="400" y1="380" x2="540" y2="470" />
    <line x1="400" y1="380" x2="400" y2="200" />
    <line x1="280" y1="260" x2="400" y2="200" />
    <line x1="520" y1="260" x2="400" y2="200" />
  </g>

  <circle cx="280" cy="260" r="8" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="520" cy="260" r="8" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="260" cy="480" r="8" fill="#0062FE" filter="url(#glow)" />
  <circle cx="540" cy="470" r="8" fill="#0062FE" filter="url(#glow)" />
  <circle cx="400" cy="200" r="10" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Team silhouette figures in front of dashboard -->
  <!-- Center figure (presenter) -->
  <path d="M400 520 C 370 520, 350 560, 340 680 L 460 680 C 450 560, 430 520, 400 520 Z" fill="#0E2849" />
  <circle cx="400" cy="490" r="25" fill="#1B3B66" />

  <!-- Left collaborator -->
  <path d="M250 560 C 220 560, 205 600, 195 680 L 305 680 C 295 600, 280 560, 250 560 Z" fill="#07192F" />
  <circle cx="250" cy="530" r="22" fill="#132B4F" />

  <!-- Right collaborator -->
  <path d="M550 550 C 520 550, 505 590, 495 680 L 605 680 C 595 590, 580 550, 550 550 Z" fill="#07192F" />
  <circle cx="550" cy="520" r="22" fill="#132B4F" />

  <!-- Digital data particles -->
  <rect x="220" y="160" width="12" height="12" fill="#0062FE" opacity="0.8" />
  <rect x="580" y="180" width="10" height="10" fill="#38BDF8" opacity="0.9" />
  <rect x="620" y="320" width="14" height="14" fill="#0062FE" opacity="0.7" />
  <rect x="160" y="360" width="10" height="10" fill="#38BDF8" opacity="0.85" />
  <rect x="330" y="140" width="8" height="8" fill="#FFFFFF" opacity="0.9" />

  <!-- Holographic UI overlay lines -->
  <rect x="230" y="320" width="100" height="4" rx="2" fill="#38BDF8" opacity="0.6" />
  <rect x="230" y="332" width="70" height="3" rx="1.5" fill="#0062FE" opacity="0.5" />
  <rect x="470" y="320" width="90" height="4" rx="2" fill="#38BDF8" opacity="0.6" />
  <rect x="470" y="332" width="60" height="3" rx="1.5" fill="#0062FE" opacity="0.5" />
</svg>
